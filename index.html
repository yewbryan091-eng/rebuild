<style>
/* Layout: one phone column, sticky date bar on top, tab bar + rest timer pinned to the bottom. Workout colours = calibrated plate colours. */
:root{
  --bg:#ECEEF0; --surface:#FFFFFF; --sunk:#E2E5E8; --ink:#14171A; --muted:#5B636B; --line:#D3D8DD;
  --fig:#1C2126; --fig-far:#9AA3AC; --equip:#B9C0C7; --iron:#3C434A;
  --c-red:#D2392A; --c-blue:#2A5FCF; --c-yellow:#D9A300; --c-green:#25894A; --c-white:#4A525A; --c-grey:#7D868F; --c-orange:#C9561A;
  --on-base:#FFFFFF; --on-plate:var(--on-base); --good:#25894A; --warn:#B86E00;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1113; --surface:#1A1D20; --sunk:#24282C; --ink:#ECEEF0; --muted:#9AA3AB; --line:#2E3338;
  --fig:#E7EAED; --fig-far:#5D656D; --equip:#3F464D; --iron:#B9C0C7;
  --c-red:#EE5040; --c-blue:#5B8BF0; --c-yellow:#F0C232; --c-green:#43B565; --c-white:#D5DADF; --c-grey:#8A939B; --c-orange:#F08A3C;
  --on-base:#0F1113; --good:#43B565; --warn:#E59A2E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1113; --surface:#1A1D20; --sunk:#24282C; --ink:#ECEEF0; --muted:#9AA3AB; --line:#2E3338;
  --fig:#E7EAED; --fig-far:#5D656D; --equip:#3F464D; --iron:#B9C0C7;
  --c-red:#EE5040; --c-blue:#5B8BF0; --c-yellow:#F0C232; --c-green:#43B565; --c-white:#D5DADF; --c-grey:#8A939B; --c-orange:#F08A3C;
  --on-base:#0F1113; --good:#43B565; --warn:#E59A2E; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);overflow-x:hidden}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--plate,var(--c-blue));outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px;padding-block:10px;min-width:0}
.brand{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.04em;text-transform:uppercase;margin-right:auto}
.datenav{display:flex;align-items:center;gap:2px}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;line-height:1}
.datelabel{min-width:78px;padding:0 4px;text-align:center;font-weight:600;font-size:15px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}
.sync.local i{background:var(--warn)}
.sync.busy i{background:var(--muted)}

main{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
main .wrap{display:flex;flex-direction:column;gap:14px;padding-block:14px}

/* hero */
.hero{border-radius:var(--r);background:var(--plate);color:var(--on-plate);padding:16px 16px 14px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.hero .eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.hero h1{font-family:var(--display);font-weight:900;font-size:64px;line-height:.86;margin:2px 0 0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.hero .sub{font-weight:600;font-size:15px;opacity:.92}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:13px;font-weight:600;padding:4px 9px;border-radius:999px;background:color-mix(in srgb,var(--on-plate) 18%,transparent);white-space:nowrap}
.hero .ring{position:absolute;right:-38px;top:-38px;width:150px;height:150px;border-radius:50%;border:16px solid color-mix(in srgb,var(--on-plate) 14%,transparent)}
.hero .ring::after{content:"";position:absolute;inset:38px;border-radius:50%;background:color-mix(in srgb,var(--on-plate) 14%,transparent)}
.motiv{font-size:15px;font-weight:500;margin-top:4px}
.swap{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:6px}
.swap select{background:color-mix(in srgb,var(--on-plate) 16%,transparent);border:0;border-radius:8px;padding:6px 8px;font-weight:600;color:var(--on-plate)}
.swap select option{color:#14171A;background:#fff}

/* cards */
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
.card h3{margin:0;font-size:17px;font-weight:700;line-height:1.2}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px 14px;font-weight:600;font-size:15px}
.btn.pri{background:var(--plate,var(--ink));border-color:transparent;color:var(--on-plate)}
.btn.ink{background:var(--ink);color:var(--bg);border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:14px;border-radius:8px}
.btn:disabled{opacity:.5}
.btn.danger{color:var(--c-red)}

/* warm-up */
.wu{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.wu:first-of-type{border-top:0}
.thumb{width:64px;height:48px;border-radius:8px;background:var(--sunk);display:block}
.wu .name{font-weight:600;font-size:15px;background:none;border:0;padding:0;text-align:left}
.wu .dose{font-size:13px;color:var(--muted)}
.check{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;font-weight:800;font-size:15px;color:transparent}
.check.on{background:var(--plate);border-color:var(--plate);color:var(--on-plate)}
.ramp{font-size:14px;background:var(--sunk);border-radius:10px;padding:10px 12px}
.ramp b{font-variant-numeric:tabular-nums}

/* exercise */
.ex{gap:8px}
.ex .head{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;background:none;border:0;padding:0;text-align:left;width:100%}
.ex .head .thumb{width:72px;height:56px}
.ex .title{font-weight:700;font-size:17px;line-height:1.2}
.ex .presc{font-size:13px;color:var(--muted);margin-top:2px}
.ex .how{font-size:12px;font-weight:700;color:var(--plate);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.hint{font-size:14px;border-left:3px solid var(--plate);padding:4px 0 4px 10px}
.hint .muted{font-size:13px}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 46px;gap:8px;align-items:center}
.set .n{font-weight:700;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.field{position:relative}
.field input{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 34px 10px 12px;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.field input::placeholder{color:var(--muted);opacity:.65;font-weight:500}
.field span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.tick{height:44px;border-radius:10px;border:2px solid var(--line);background:transparent;font-weight:800;font-size:18px;color:var(--muted)}
.tick.on{background:var(--plate);border-color:var(--plate);color:var(--on-plate)}
.set.done input{border-color:color-mix(in srgb,var(--plate) 50%,var(--line))}
.addset{align-self:flex-start}

.exbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:-4px}
.thumbwrap{position:relative;display:block;width:72px;height:56px}
.exn{position:absolute;left:-6px;top:-6px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:800;display:grid;place-items:center;line-height:1}
.card.ex.ss{border-left:4px solid var(--plate)}
.card.ex.sscont{margin-top:-10px;border-top-left-radius:4px;border-top-right-radius:4px}
.sstag{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--plate)}
#olist{display:flex;flex-direction:column}
.orow{display:grid;grid-template-columns:34px 30px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);background:var(--surface)}
.orow:first-child{border-top:0}
.orow.ss{box-shadow:inset 4px 0 0 var(--plate);padding-left:8px}
.orow.drag{background:var(--sunk);border-radius:10px}
.orow .exn{position:static}
.ogrip{font-size:20px;color:var(--muted);touch-action:none;cursor:grab;text-align:center;padding:8px 0;user-select:none;-webkit-user-select:none}
.onm{font-weight:600;font-size:15px;line-height:1.2;display:flex;flex-direction:column;gap:2px;min-width:0}
.onm small{font-weight:500;font-size:12px}
.oarr{display:flex;gap:4px}
.oarr .iconbtn{width:34px;height:34px}
.oarr .iconbtn:disabled{opacity:.3}
.olink{align-self:center;margin:-2px 0;border:1px dashed var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;color:var(--muted)}
.olink.on{border-style:solid;border-color:var(--plate);color:var(--plate)}
.exhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.swapbtn{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:7px 10px;font-weight:800;font-size:17px;line-height:1;min-width:54px}
.swapbtn span{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.setbtns{display:flex;gap:4px}
.hint.up{border-left-color:var(--good)} .hint.down{border-left-color:var(--warn)}
.addex{width:100%;border-style:dashed;background:transparent;padding:14px;color:var(--muted)}
.finish{width:100%;padding:16px;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.05em;text-transform:uppercase}
.up{color:var(--good)} .down{color:var(--warn)}
.tgt{display:flex;flex-direction:column;gap:7px;font-size:14px}
.tgt b{color:var(--ink);font-weight:700}
.didrow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.didrow:first-child{border-top:0}
.didrow.col{flex-direction:column;gap:3px}
.didrow .num{text-align:right}
.didrow.col .num{text-align:left}
.keep{display:flex;gap:10px;align-items:center;font-size:15px;font-weight:600;background:var(--sunk);border-radius:10px;padding:12px}
.keep input{width:20px;height:20px;accent-color:var(--plate)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chipb{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.chipb.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pickhead{position:sticky;top:-14px;background:var(--surface);z-index:2;display:flex;flex-direction:column;gap:10px;margin:-14px 0 0;padding:14px 0 8px}
.sheet-h{font-family:var(--display);font-size:26px;text-transform:uppercase;margin:0;line-height:1;font-weight:800}
.slotgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.slotgrid label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.slotgrid .inp{padding:8px;font-size:16px}
.pk{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 2px}
.pk:disabled{opacity:.45}
.pk .pn{font-weight:600;font-size:16px;line-height:1.25}
.pk .pm{font-size:13px;color:var(--muted);margin-top:2px}
.label.pl{padding:12px 0 4px}
.liftrow{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n s" "n b";gap:1px 10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 0}
.liftrow:first-child{border-top:0}
.liftrow .ln{grid-area:n;font-weight:600;font-size:15px;align-self:center}
.liftrow > span:nth-child(2){grid-area:s;text-align:right}
.liftrow > span:nth-child(3){grid-area:b;text-align:right}

/* cardio */
.cardio .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.cardio label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.inp{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:16px;font-weight:600}
textarea.inp{font-weight:500;resize:vertical;min-height:64px}
.total{display:flex;gap:16px;flex-wrap:wrap;font-size:14px}
.total b{font-size:20px;font-family:var(--display);font-weight:800;letter-spacing:.02em}

/* week */
.wk{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.wk:first-of-type{border-top:0}
.wk .d{font-family:var(--display);font-weight:800;font-size:22px;line-height:1;text-transform:uppercase}
.wk .d small{display:block;font-family:var(--body);font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--plate);color:var(--on-plate)}
.wk .st{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.wk.today{background:linear-gradient(90deg,color-mix(in srgb,var(--plate) 9%,transparent),transparent)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--sunk);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;font-weight:700;padding:4px 6px 6px 0}
td{padding:7px 6px 7px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top}
.tablebox{overflow-x:auto}

/* food */
.bar{height:12px;border-radius:6px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--plate);border-radius:6px}
.bar.over i{background:var(--c-red)}
.macro{display:flex;flex-direction:column;gap:6px}
.macro .row b{font-family:var(--display);font-weight:800;font-size:26px;line-height:1}
.photos{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.photos img,.photos .ph{width:84px;height:84px;object-fit:cover;border-radius:10px;flex:none;background:var(--sunk);border:0;padding:0}
.photos .ph{display:grid;place-items:center;font-size:12px;color:var(--muted)}
.pickrow{display:flex;gap:8px;flex-wrap:wrap}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.meal{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.meal:first-of-type{border-top:0;padding-top:0}
.macros{display:flex;gap:12px;flex-wrap:wrap;font-size:14px;font-variant-numeric:tabular-nums}
.macros b{font-weight:700}
.conf{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.res{background:var(--sunk);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.items{font-size:14px;display:flex;flex-direction:column;gap:3px}
.items div{display:flex;justify-content:space-between;gap:10px}
.edit4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.edit4 label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.edit4 .inp{padding:8px;font-size:16px}
.status{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--plate);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:var(--c-red);font-size:14px}

/* body */
.form2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.form2 label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.target{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.math{font-size:13px;color:var(--muted)}
.spark{width:100%;height:auto;display:block}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,7,9,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.big{width:100%;aspect-ratio:240/180;max-width:100%;background:var(--sunk);border-radius:14px;display:block}
.cues{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px;font-size:16px}
.cues li::marker{color:var(--plate)}
.avoid{font-size:15px;background:color-mix(in srgb,var(--c-red) 10%,var(--surface));border-radius:10px;padding:10px 12px}
.avoid b{color:var(--c-red)}
.lightbox img{width:100%;border-radius:12px}

/* bottom */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{background:none;border:0;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--ink)}
.rest{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.rest .clock{font-family:var(--display);font-weight:900;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;min-width:74px}
.rest .rb{flex:1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.rest .rb i{display:block;height:100%;background:var(--plate)}
.rest.over .clock{color:var(--good)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}

/* figure */
.floor{stroke:var(--line);stroke-width:2}
.eq{fill:var(--equip)}
.eqs{stroke:var(--equip);stroke-width:8;stroke-linecap:round;fill:none}
.post{fill:var(--equip)}
.limb{stroke:var(--fig);stroke-width:7;stroke-linecap:round;fill:none}
.far{stroke:var(--fig-far)}
.torso{stroke:var(--fig);stroke-width:12;stroke-linecap:round}
.torsoF{fill:var(--fig);stroke:var(--fig);stroke-width:5;stroke-linejoin:round}
.head{fill:var(--fig)}
.foot{stroke-width:6}
.plate{fill:var(--plate,var(--c-red))}
.hub{fill:var(--surface)}
.iron{fill:var(--iron)}
.ironl{stroke:var(--iron);stroke-width:4;stroke-linecap:round}
.cable{stroke:var(--muted);stroke-width:1.5}
.pulley{fill:var(--muted)}
/* workout chooser, coach, sign-in */
button.sync{background:none;border:0;padding:6px 2px;font-size:12px;color:var(--muted)}
.wbtn{align-self:flex-start;margin-top:6px;border:0;border-radius:8px;padding:7px 11px;font-weight:700;font-size:14px;background:color-mix(in srgb,var(--on-plate) 16%,transparent);color:var(--on-plate)}
.wo{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 2px;font-size:16px;font-weight:600}
.wo .dot{width:12px;height:12px;border-radius:50%;background:var(--plate)}
.wo.on{color:var(--plate)}
.row>.wo{flex:1;min-width:0}
.csess{display:grid;grid-template-columns:62px minmax(0,1fr) 20px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.auth{display:flex;flex-direction:column;gap:10px}
.auth label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.pending{font-size:14px;color:var(--warn)}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
@media (max-width:380px){.hero h1{font-size:54px}.set{grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 42px;gap:6px}.sync span{display:none}}

      <div class="st">${st}</div></button>`;
  }
  let h=coachCard(mon)+`<section class="card"><div class="row between"><h2>Week of ${nice(mon)}</h2><div class="row" style="gap:4px"><button class="iconbtn" data-act="wkprev" aria-label="Previous week">‹</button><button class="iconbtn" data-act="wknext" aria-label="Next week">›</button></div></div>

    </div><div>${rows}</div></section>`;
  // sessions
  const all=Object.keys(S.days).filter(x=>setsDone(S.days[x])>0).sort().reverse();
  const list=all.filter(x=>fitsF(planOf(x),S.logf)).slice(0,40);
  h+=`<section class="card"><h2>Sessions</h2>
    <div class="chips">${LOGF.map(([f,l])=>`<button class="chipb${S.logf===f?' on':''}" data-act="logf" data-f="${f}">${l}</button>`).join('')}</div>
    ${list.length?`<div>${list.map(x=>{const d=S.days[x],pid=planOf(x),pv=prevSession(x,pid),v=dayVolume(d),pvv=pv?dayVolume(S.days[pv]):0,df=pvv&&d.finished?Math.round((v-pvv)/pvv*100):null,mins=d.finished&&d.finished.dur;

      :`<div class="muted">${all.length?'No sessions of this type yet.':'Finish your first session and it lands here, with every set, so you can see if you’re getting stronger.'}</div>`}

  for(const x of Object.keys(S.days).sort()){const d=S.days[x];for(const id in (d.sets||{})){const ds=doneSets(d,id);if(ds.length)(seen[id]=seen[id]||[]).push({k:x,sc:liftScore(id,ds)})}}
  const lifts=Object.keys(seen).sort((a,b)=>seen[b][seen[b].length-1].k.localeCompare(seen[a][seen[a].length-1].k));
  h+=`<section class="card"><h2>Lifts</h2>${lifts.length?`<div class="small muted">Best set each session. ▲ means you beat the session before.</div><div>${lifts.map(id=>{
      const hs=seen[id], l=hs[hs.length-1], p=hs[hs.length-2]; const best=hs.reduce((a,b)=>b.sc.v>a.sc.v?b:a);
      const tr=!p?'':l.sc.v>p.sc.v+0.01?'<span class="up">▲</span>':l.sc.v<p.sc.v-0.01?'<span class="down">▼</span>':'<span class="muted">=</span>';

    :'<div class="muted">Every exercise you log shows up here with its trend.</div>'}</section>`;

}

function weightChart(){
  const pts=Object.keys(S.days).filter(k=>num(S.days[k].bw)).sort().slice(-60).map(k=>({k,w:num(S.days[k].bw)}));
  if(pts.length<2) return '';
  const W=320,H=110,pl=34,pr=8,pt_=10,pb=20;
  const ws=pts.map(p=>p.w), lo=Math.floor(Math.min(...ws)-0.5), hi=Math.ceil(Math.max(...ws)+0.5);
  const t0=fromKey(pts[0].k).getTime(), t1=fromKey(pts[pts.length-1].k).getTime()||t0+1;
  const X=k=>pl+(fromKey(k).getTime()-t0)/Math.max(1,t1-t0)*(W-pl-pr), Y=w=>pt_+(hi-w)/(hi-lo)*(H-pt_-pb);
  const d=pts.map((p,i)=>`${i?'L':'M'}${f1(X(p.k))} ${f1(Y(p.w))}`).join(' ');
  const last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend">
    <line x1="${pl}" x2="${W-pr}" y1="${Y(hi)}" y2="${Y(hi)}" style="stroke:var(--line)"/><line x1="${pl}" x2="${W-pr}" y1="${Y(lo)}" y2="${Y(lo)}" style="stroke:var(--line)"/>
    <text x="${pl-6}" y="${Y(hi)+4}" text-anchor="end" style="fill:var(--muted);font-size:11px">${hi}</text><text x="${pl-6}" y="${Y(lo)+4}" text-anchor="end" style="fill:var(--muted);font-size:11px">${lo}</text>
    <text x="${pl}" y="${H-4}" style="fill:var(--muted);font-size:11px">${nice(pts[0].k)}</text><text x="${W-pr}" y="${H-4}" text-anchor="end" style="fill:var(--muted);font-size:11px">${nice(last.k)}</text>
    <path d="${d}" style="fill:none;stroke:var(--plate);stroke-width:2.5;stroke-linejoin:round"/>
    <circle cx="${f1(X(last.k))}" cy="${f1(Y(last.w))}" r="4" style="fill:var(--plate)"/></svg>`;
}

function renderPicker(){

/* ============ images ============ */
async function shrink(file,max=1400){
  try{
    let bmp;
    try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){bmp=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(file)})}
    const w=bmp.width,h=bmp.height,sc=Math.min(1,max/Math.max(w,h));
    const c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));
    return blob||file;
  }catch(e){return file}
}
async function estimate(){
  const d=S.draft; if(!d||d.busy) return;

}

      else{ if(svg.dataset.paused){delete svg.dataset.paused;el.textContent='Pause'}else{svg.dataset.paused='1';el.textContent='Play'} } break;}
    case 'warm': {const d=editDay(k); d.warm=d.warm||{}; d.warm[el.dataset.id]=!d.warm[el.dataset.id]; render(); break;}
    case 'cardio': {const d=editDay(k); d.cardio=d.cardio||{}; d.cardio.done=!d.cardio.done; if(d.cardio.done&&!d.cardio.min)d.cardio.min=planAt(k).cardio.min; render(); break;}
    case 'addset': {const d=editDay(k); const sl=lineupFor(d,k)[+el.dataset.i]; d.sets=d.sets||{}; const arr=d.sets[sl.ex]=d.sets[sl.ex]||[]; const n=Math.max(sl.sets,arr.length); sl.sets=n+1; render(); break;}
    case 'rmset': {const d=editDay(k); const sl=lineupFor(d,k)[+el.dataset.i]; d.sets=d.sets||{}; const arr=d.sets[sl.ex]=d.sets[sl.ex]||[]; const n=Math.max(sl.sets,arr.length);
      if(arr[n-1]&&arr[n-1].d){toast('Untick the last set first.');break} arr.length=Math.min(arr.length,n-1); sl.sets=Math.max(1,n-1); render(); break;}
    case 'slot': openPicker('swap',+el.dataset.i); break;
    case 'addex': openPicker('add'); break;
    case 'pickg': S.pick.g=el.dataset.g; S.pick.q=''; renderPicker(); break;
    case 'pickex': {const d=editDay(k); const lu=lineupFor(d,k); const id=el.dataset.id;
      if(S.pick.mode==='swap'){const old=lu[S.pick.i].ex; lu[S.pick.i].ex=id; toast(`Swapped to ${exOf(id).n}${doneSets(d,old).length?` (your ${exOf(old).n} sets stay logged)`:''}`); closeLayer()}
      // adding keeps the list open so a whole custom workout can be built in one go
      else {lu.push(slotOf(id,exOf(id).sc)); toast(`Added ${exOf(id).n}`); const pl=document.getElementById('picklist'); if(pl) pl.innerHTML=pickList()}
      render(); break;}
    // tapping a partner moves it right under this exercise and links them; tapping a linked one unlinks it
    case 'sswith': {const d=editDay(k), lu=lineupFor(d,k), a=lu[S.pick.i], b=lu[+el.dataset.j];
      if(a.ss&&b.ss===a.ss){delete b.ss; tidySS(lu); toast(`${exOf(b.ex).n} unlinked`)}
      else {lu.splice(lu.indexOf(b),1); lu.splice(lu.indexOf(a)+1,0,b); const id=a.ss||uid().slice(0,6); a.ss=id; b.ss=id; tidySS(lu); toast(`Superset: ${exOf(a.ex).n} + ${exOf(b.ex).n}`)}
      closeLayer(); render(); break;}
    case 'rmslot': {const d=editDay(k); const lu=lineupFor(d,k); const [gone]=lu.splice(S.pick.i,1); closeLayer(); render(); toast(`Removed ${exOf(gone.ex).n} from today`); break;}
    case 'order': openOrder(); break;
    case 'omv': {const d=editDay(k), lu=lineupFor(d,k), i=+el.dataset.i, j=i+(+el.dataset.d); if(j<0||j>=lu.length)break; lu.splice(j,0,lu.splice(i,1)[0]); tidySS(lu); renderOrderList(); render(); break;}
    case 'olink': {const d=editDay(k), lu=lineupFor(d,k), i=+el.dataset.i, a=lu[i], b=lu[i+1];
      if(a.ss&&a.ss===b.ss){const nid=uid().slice(0,6);for(let j=i+1;j<lu.length&&lu[j].ss===a.ss;j++)lu[j].ss=nid}
      else {const id=a.ss||b.ss||uid().slice(0,6), old=b.ss; a.ss=id; for(let j=i+1;j<lu.length&&(j===i+1||(old&&lu[j].ss===old));j++)lu[j].ss=id}
      tidySS(lu); renderOrderList(); render(); break;}
    case 'finish': openFinish(); break;
    case 'dofinish': {
      const d=editDay(k), pid=planOf(k), plan=PI(pid,k), sm=summary(k); lineupFor(d,k);
      d.finished={at:new Date().toISOString(),dur:sm.mins,vol:sm.vol,sets:sm.done,prs:sm.prs.length};
      const keep=document.getElementById('keeplu');
      if(keep&&keep.checked){
        const full=clone(d.full||d.lineup);
        if(pid==='custom'){const id=uid().slice(0,8), name=(document.getElementById('cname')?.value||'').trim().slice(0,40)||'Custom'; S.customs[id]={name,lineup:full}; queueSave('customs/'+id); d.plan='c_'+id; d.cname=name}
        else if(String(pid).startsWith('c_')&&S.customs[pid.slice(2)]){S.customs[pid.slice(2)].lineup=full; queueSave('customs/'+pid.slice(2))}
        else {S.tpl[pid]={lineup:full}; queueSave('templates/'+pid)}
      }
      rest.end=0; clearInterval(rest.iv); try{wake&&wake.release()}catch(e){}
      closeLayer(); render(); window.scrollTo(0,0);
      const nk=nextPlanDate(k,pid); toast(`${plan.n} saved.${nk?` Next ${plan.n}: ${DOW[dowOf(nk)].slice(0,3)} ${nice(nk)}.`:''}`); break;}
    case 'reopen': {const d=editDay(k); delete d.finished; render(); break;}
    case 'logf': S.logf=el.dataset.f; render(); break;
    case 'sess': openSession(el.dataset.k); break;
    case 'lift': openLift(el.dataset.id); break;
    case 'tick': {
      ensureAudio(); keepAwake();
      const id=el.dataset.id, i=+el.dataset.i, [phW,phR]=el.dataset.ph.split('|');
      const d=editDay(k); lineupFor(d,k); d.sets=d.sets||{}; const arr=d.sets[id]=d.sets[id]||[]; while(arr.length<=i)arr.push({});
      const s=arr[i];
      const wIn=document.getElementById(`w-${id}-${i}`), rIn=document.getElementById(`r-${id}-${i}`);
      if(wIn&&wIn.value!=='') s.w=num(wIn.value); if(rIn&&rIn.value!=='') s.r=num(rIn.value);
      if(!s.d){
        if(s.w==null&&num(phW)!=null) s.w=num(phW);
        if(s.r==null&&num(phR)!=null) s.r=num(phR);
        if(s.w==null&&EX[id].bw) s.w=0;
        if(s.w==null||s.r==null){toast('Enter the weight and reps first.');break}
        const prev=bestE1(id,k,i); s.d=true; if(!d.started) d.started=new Date().toISOString();
        if(prev&&s.r>0&&e1rm(s.w,s.r)>prev.v+0.01&&(s.w>0)) toast(`PR! ${EX[id].n}: ${fmtW(s.w)} × ${s.r} (est. 1RM ${fmtW(Math.round(e1rm(s.w,s.r)*2)/2)} kg)`);
        const lu=lineupOf(k), si=lu.findIndex(x=>x.ex===id), grp=si>=0?slotLabels(lu).grp[si]:null;
        if(grp&&si!==grp[grp.length-1]) startRest(10,`${exOf(lu[si+1].ex).n} (superset, no rest)`);
        else if(grp) startRest(lu[grp[grp.length-1]].rest||90,`${exOf(lu[grp[0]].ex).n} (next round)`);
        else startRest(+el.dataset.rest||90,EX[id].n);
      } else s.d=false;
      render(); break;}
    case 'restskip': rest.end=0; clearInterval(rest.iv); renderRest(); break;
    case 'rest30': rest.end+=30000; rest.total+=30; rest.beeped=false; renderRest(); break;
    case 'describe': S.draft={mode:'text',photos:[],note:''}; render(); setTimeout(()=>document.getElementById('mnote')?.focus(),50); break;
    case 'manual': S.draft={mode:'manual',photos:[],res:null}; render(); break;
    case 'cancelmeal': if(S.draft){S.draft.photos.forEach(p=>{try{URL.revokeObjectURL(p.url)}catch(e){}})} S.draft=null; render(); break;
    case 'rmphoto': {const d=S.draft; const p=d.photos.splice(+el.dataset.i,1)[0]; try{URL.revokeObjectURL(p.url)}catch(e){} d.res=null; render(); break;}
    case 'estimate': estimate(); break;
    case 'savemeal': saveMeal(k); break;
    case 'editmeal': {const m=(getDay(k).meals||[]).find(x=>x.id===el.dataset.id); if(!m)break; S.editMeal={id:m.id,name:m.name||'',kcal:m.kcal,p:m.p,c:m.c,f:m.f}; S.confirmDel=null; render(); break;}
    case 'canceledit': S.editMeal=null; render(); break;
    case 'saveedit': saveMealEdit(k); break;
    case 'askdel': S.confirmDel=el.dataset.id; render(); break;
    case 'keepmeal': S.confirmDel=null; render(); break;
    case 'delmeal': {const d=editDay(k); const m=(d.meals||[]).find(x=>x.id===el.dataset.id); d.meals=(d.meals||[]).filter(x=>x.id!==el.dataset.id); S.confirmDel=null; render();
      if(m&&(m.photos||[]).length) deletePhotos(m.photos); toast('Meal deleted'); break;}
    case 'lightbox': if(el.dataset.src) lightbox(el.dataset.src); break;
    case 'savelater': saveMeal(k,true); break;
    case 'workouts': S.confirmCustom=null; openWorkouts(); break;
    case 'setplan': {const d=editDay(k), p=el.dataset.p;
      if(d.plan!==p){d.plan=p; delete d.lineup; delete d.full; delete d.cname; if(p.startsWith('c_')&&S.customs[p.slice(2)]) d.cname=S.customs[p.slice(2)].name}
      closeLayer(); render(); window.scrollTo(0,0); break;}
    case 'newcustom': {const d=editDay(k); d.plan='custom'; d.lineup=[]; d.cname='Custom'; delete d.full; closeLayer(); render(); window.scrollTo(0,0); openPicker('add'); break;}
    case 'delcustom': {const id=el.dataset.id; if(S.confirmCustom!==id){S.confirmCustom=id; openWorkouts(); break}
      const c=S.customs[id]; S.confirmCustom=null; delete S.customs[id]; queueSave('customs/'+id); openWorkouts(); render(); toast(`Deleted ${c?c.name:'that workout'}`); break;}
    case 'short': {const d=editDay(k), lu=lineupFor(d,k);
      if(d.full){d.lineup=d.full; delete d.full; toast('Back to the full session')}
      else {const keep=runs(lu).slice(0,3).flat(); d.full=clone(lu); d.lineup=keep.map(i=>lu[i]); toast('Short session: the 3 main lifts. Still counts.')}
      render(); break;}
    case 'coach': runCoach(el.dataset.mon); break;
    case 'account': openAccount(); break;
    case 'signin': case 'signup': authGo(act); break;
    case 'syncnow': S.syncErr=''; await syncAll(); if(document.querySelector('[aria-label="Sync"]')) openAccount(); break;
    case 'signout': if(sb) await sb.auth.signOut(); closeLayer(); render(); setSync(); break;
    case 'savescan': saveScan(); break;
  }
});
document.addEventListener('change',async ev=>{
  const el=ev.target;
  if(el.id==='swap'){const d=editDay(S.date); d.plan=el.value===SCHED[dowOf(S.date)]?null:el.value; if(!d.plan)delete d.plan; delete d.lineup; render(); return}
  if(el.dataset.act==='pick'&&el.files&&el.files.length){
    const maxN=AI_MAX_PHOTOS;
    if(!S.draft||S.draft.mode!=='photo') S.draft={mode:'photo',photos:[],note:S.draft?.note||''};
    const d=S.draft; const files=[...el.files].slice(0,Math.max(0,maxN-d.photos.length));
    if(el.files.length>files.length) toast(`Up to ${maxN} photos per meal.`);
    for(const f of files){const blob=await shrink(f);d.photos.push({blob,url:URL.createObjectURL(blob)})}
    d.res=null; render(); return;
  }
  if(el.dataset.act==='scanpick'&&el.files&&el.files[0]){readScan(el.files[0]);return}
});
document.addEventListener('input',ev=>{
  const el=ev.target, k=S.date;
  if(el.id==='pq'&&S.pick){S.pick.q=el.value; document.getElementById('picklist').innerHTML=pickList(); return}
  if(el.dataset.slot&&S.pick){const v=num(el.value); if(v==null||v<0) return; const d=editDay(k); const sl=lineupFor(d,k)[S.pick.i]; sl[el.dataset.slot]=el.dataset.slot==='sets'?Math.max(1,Math.round(v)):Math.round(v); render(); return}
  if(el.dataset.set){const [id,i,f]=el.dataset.set.split('|'); const d=editDay(k); lineupFor(d,k); d.sets=d.sets||{}; const arr=d.sets[id]=d.sets[id]||[]; while(arr.length<=+i)arr.push({}); arr[+i][f]=el.value===''?null:num(el.value); return}
  if(el.dataset.day){const d=editDay(k); const path=el.dataset.day.split('.'); const v=el.value===''?null:num(el.value); if(path.length===2){d[path[0]]=d[path[0]]||{};d[path[0]][path[1]]=v}else d[path[0]]=v; if(path[0]==='bw')pendingRender=true; return}
  if(el.dataset.prof){S.profile[el.dataset.prof]=el.value===''?null:num(el.value); saveProfile(); pendingRender=true; return}
  if(el.dataset.draft&&S.draft){S.draft[el.dataset.draft]=el.value; const b=document.querySelector('[data-act="estimate"]'); if(b&&S.draft.mode==='text')b.disabled=!el.value.trim(); return}
  if(el.dataset.me&&S.editMeal){S.editMeal[el.dataset.me]=el.value; return}
  if(el.dataset.res&&S.draft){S.draft.res=S.draft.res||{}; S.draft.res[el.dataset.res]=el.dataset.res==='name'?el.value:num(el.value); return}
  if(el.dataset.scan){S.scanDraft=S.scanDraft||{}; S.scanDraft[el.dataset.scan]=el.value; return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLayer()});
// a new day starts a fresh session: if the app was left open on "today", follow the date over midnight
let lastToday=todayKey();
function rollover(){const t=todayKey(); if(t===lastToday) return; if(S.date===lastToday&&S.tab!=='food'){S.date=t;requestRender()} lastToday=t}
setInterval(rollover,60000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){lsSave();return} rollover(); if(rest.end)keepAwake(); syncAll()});
init();
if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
